[project]
name = "training-season"
version = "0.1.0"
description = "Self-hosted single-user running coach"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "BLE",
    "C",
    "D",
    "DTZ",
    "E",
    "EXE",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "INT",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T",
    "TC",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103", "S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
