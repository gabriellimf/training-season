[project]
name = "training-season"
version = "0.1.0"
description = "Self-hosted single-user running coach"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = [
    "^\\.venv/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

